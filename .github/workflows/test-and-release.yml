# Every push: run all tests on a real Windows PC (and Linux). Only if they
# all pass on main does the `release` branch move forward, and `release`
# is the only thing the app's updater installs. See RELEASING.md.
name: Test and release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LOCALAPPDATA: ${{ github.workspace }}/ci-appdata
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux system packages (screen + audio libraries)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libportaudio2 libsndfile1
      - name: Install Beat Sorter's packages (same as setup.bat)
        id: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes pytest-github-actions-annotate-failures
      - name: Check the code for mistakes (undefined names, typos)
        run: python -m pyflakes beatsorter
      - name: "Tests: names, keys and BPM"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_filename_tags.py tests/test_keys.py; else python -m pytest -v tests/test_filename_tags.py tests/test_keys.py; fi
      - name: "Tests: Sorted folder, folders, layouts"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_builder.py tests/test_organizer.py; else python -m pytest -v tests/test_builder.py tests/test_organizer.py; fi
      - name: "Tests: scanning (worker crashes, first-scan warm-up)"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_pipeline.py; else python -m pytest -v tests/test_pipeline.py; fi
      - name: "Tests: player"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_player.py; else python -m pytest -v tests/test_player.py; fi
      - name: "Tests: updater"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_apply_update.py; else python -m pytest -v tests/test_apply_update.py; fi
      - name: "Tests: Core/Full editions"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_editions.py; else python -m pytest -v tests/test_editions.py; fi
      - name: "Tests: whole app, like a user"
        if: always() && steps.install.outcome == 'success'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m pytest -v tests/test_app_e2e.py; else python -m pytest -v tests/test_app_e2e.py; fi
      - name: App opens through the real startup path (Windows)
        if: always() && runner.os == 'Windows' && steps.install.outcome == 'success'
        run: python -m beatsorter --smoke-test
      - name: App opens through the real startup path (Linux)
        if: always() && runner.os == 'Linux' && steps.install.outcome == 'success'
        run: xvfb-run -a python -m beatsorter --smoke-test

  windows-download:
    # Builds both no-Python Windows downloads (Core and Full) and tests each
    # the way a user gets it.
    strategy:
      fail-fast: false
      matrix:
        edition: [core, full]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the ${{ matrix.edition }} Windows download (Python included)
        shell: pwsh
        run: packaging/build_windows.ps1 -Edition ${{ matrix.edition }}
      - name: Test it on a PC with no Python (unzip, start, feature matrix, full tests)
        shell: pwsh
        run: packaging/test_bundle.ps1 -Edition ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        # always: so the download size can be measured even if a test failed
        # (release only runs when this whole job passed)
        if: always()
        with:
          name: BeatSorter-Windows-${{ matrix.edition }}
          if-no-files-found: ignore
          path: dist/*.zip
          retention-days: 7

  release:
    needs: [test, windows-download]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish to users (move the release branch to this tested commit)
        run: git push origin HEAD:refs/heads/release --force
      - uses: actions/download-artifact@v4
        with:
          pattern: BeatSorter-Windows-*
          merge-multiple: true
      - name: Put both Windows downloads on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' beatsorter/version.py)
          python3 -c "import sys; sys.path.insert(0, '.'); from beatsorter.updater import changelog_section; print(changelog_section(open('CHANGELOG.txt', encoding='utf-8').read(), '$v'))" > notes.txt
          {
            printf '\n\n**Downloads** (unzip and double-click **Beat Sorter.exe** — no Python needed):\n'
            printf '* **BeatSorter-Windows-Core.zip** — recommended. Scan, organize, play and tag your beats.\n'
            printf '* **BeatSorter-Windows.zip** (Full) — adds YouTube download and the Essentia key vote.\n'
          } >> notes.txt
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" BeatSorter-Windows.zip BeatSorter-Windows-Core.zip --clobber
          else
            gh release create "v$v" BeatSorter-Windows.zip BeatSorter-Windows-Core.zip --target "$GITHUB_SHA" --title "Beat Sorter $v" --notes-file notes.txt --latest
          fi
